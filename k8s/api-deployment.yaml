apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processing-api
  namespace: video-processing
  labels:
    app.kubernetes.io/name: video-processing
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: video-processing
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-processing
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/richinmrudul/distributed-video-processing-infra-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: video-processing-config
            - secretRef:
                name: video-processing-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: video-processing-api
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
