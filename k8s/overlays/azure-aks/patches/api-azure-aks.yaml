apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processing-api
  namespace: video-processing
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
