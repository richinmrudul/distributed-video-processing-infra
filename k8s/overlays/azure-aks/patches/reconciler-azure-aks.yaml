apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processing-reconciler
  namespace: video-processing
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: reconciler
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
