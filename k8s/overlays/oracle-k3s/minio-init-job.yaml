# Oracle Always Free k3s demo bucket bootstrap only.
apiVersion: batch/v1
kind: Job
metadata:
  name: video-processing-minio-init
  namespace: video-processing
  labels:
    app.kubernetes.io/name: video-processing
    app.kubernetes.io/component: minio-init
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set local http://video-processing-minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do
                sleep 2
              done
              mc mb --ignore-existing local/raw-videos
              mc mb --ignore-existing local/processed-videos
              mc mb --ignore-existing local/thumbnails
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: video-processing-secrets
                  key: OBJECT_STORAGE_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: video-processing-secrets
                  key: OBJECT_STORAGE_SECRET_KEY
