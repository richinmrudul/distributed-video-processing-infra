apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processing-api
  namespace: video-processing
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/richinmrudul/distributed-video-processing-infra-api:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
