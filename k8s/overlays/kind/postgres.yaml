# Local kind smoke-test dependency only. Production should use managed Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processing-postgres
  namespace: video-processing
  labels:
    app.kubernetes.io/name: video-processing
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-processing
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-processing
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: video
            - name: POSTGRES_PASSWORD
              value: video
            - name: POSTGRES_DB
              value: video
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "video", "-d", "video"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: video-processing-postgres
  namespace: video-processing
spec:
  selector:
    app.kubernetes.io/name: video-processing
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
