# Local kind smoke-test dependency only. Production should use managed Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processing-redis
  namespace: video-processing
  labels:
    app.kubernetes.io/name: video-processing
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-processing
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-processing
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: video-processing-redis
  namespace: video-processing
spec:
  selector:
    app.kubernetes.io/name: video-processing
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
