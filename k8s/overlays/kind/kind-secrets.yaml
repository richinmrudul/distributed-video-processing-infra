# Local kind smoke-test secrets only. Do not use these values in production.
apiVersion: v1
kind: Secret
metadata:
  name: video-processing-secrets
  namespace: video-processing
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://video:video@video-processing-postgres:5432/video"
  REDIS_URL: "redis://video-processing-redis:6379/0"
  ADMIN_API_KEY: "dev-admin-key"
  OBJECT_STORAGE_ENDPOINT: "http://video-processing-minio:9000"
  OBJECT_STORAGE_PUBLIC_ENDPOINT: "http://localhost:19000"
  OBJECT_STORAGE_ACCESS_KEY: "minioadmin"
  OBJECT_STORAGE_SECRET_KEY: "minioadmin"
  OBJECT_STORAGE_REGION: "us-east-1"
  OBJECT_STORAGE_SECURE: "false"
