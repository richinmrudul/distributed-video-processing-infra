# Example only. Copy to k8s/secrets.yaml, replace every value, and keep secrets.yaml out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: video-processing-secrets
  namespace: video-processing
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://USER:PASSWORD@postgres.example.internal:5432/video"
  REDIS_URL: "redis://redis.example.internal:6379/0"
  ADMIN_API_KEY: "replace-with-a-real-admin-secret"
  OBJECT_STORAGE_ENDPOINT: "https://s3.example.com"
  OBJECT_STORAGE_PUBLIC_ENDPOINT: "https://s3.example.com"
  OBJECT_STORAGE_ACCESS_KEY: "replace-with-object-storage-access-key"
  OBJECT_STORAGE_SECRET_KEY: "replace-with-object-storage-secret-key"
  OBJECT_STORAGE_REGION: "us-east-1"
  OBJECT_STORAGE_SECURE: "true"
