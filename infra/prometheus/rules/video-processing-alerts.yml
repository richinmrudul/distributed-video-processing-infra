groups:
  - name: video-processing-alerts
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 30s
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API target is down"
          description: "Prometheus cannot scrape the FastAPI API metrics endpoint."

      - alert: WorkerFleetDown
        expr: sum(up{job="workers"}) == 0
        for: 30s
        labels:
          severity: critical
          service: workers
        annotations:
          summary: "All worker targets are down"
          description: "Prometheus cannot scrape any RQ worker metrics targets."

      - alert: WorkerReplicaMissing
        expr: sum(up{job="workers"}) < 3
        for: 1m
        labels:
          severity: warning
          service: workers
        annotations:
          summary: "Expected worker replica count is below 3"
          description: "The worker fleet has fewer than 3 scrapeable worker targets."

      - alert: QueueBacklogHigh
        expr: queue_depth{queue_name="video-processing"} > 20
        for: 1m
        labels:
          severity: warning
          service: queue
        annotations:
          summary: "Video processing queue backlog is high"
          description: "The video-processing queue has more than 20 queued jobs."

      - alert: RetryExhaustionsDetected
        expr: increase(video_retry_exhausted_total[5m]) > 0
        labels:
          severity: warning
          service: workers
        annotations:
          summary: "Retry-exhausted video jobs detected"
          description: "At least one video processing job exhausted all retry attempts in the last 5 minutes."

      - alert: FailedJobsPresent
        expr: sum(failed_jobs_current{retry_exhausted="true"}) > 0
        for: 1m
        labels:
          severity: warning
          service: jobs
        annotations:
          summary: "Retry-exhausted failed jobs exist"
          description: "There are retry-exhausted failed video jobs requiring operator attention."

      - alert: ApiHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API p95 latency is high"
          description: "The API p95 request latency is above 1 second for 2 minutes."
