groups:
  - name: video-processing-alerts
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 30s
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API target is down"
          description: "Prometheus cannot scrape the FastAPI API metrics endpoint."

      - alert: WorkerFleetDown
        expr: sum(up{job="workers"}) == 0
        for: 30s
        labels:
          severity: critical
          service: workers
        annotations:
          summary: "All worker targets are down"
          description: "Prometheus cannot scrape any RQ worker metrics targets."

      - alert: WorkerReplicaMissing
        expr: sum(up{job="workers"}) < 3
        for: 1m
        labels:
          severity: warning
          service: workers
        annotations:
          summary: "Expected worker replica count is below 3"
          description: "The worker fleet has fewer than 3 scrapeable worker targets."

      - alert: QueueBacklogHigh
        expr: queue_depth{queue_name="video-processing"} > 20
        for: 1m
        labels:
          severity: warning
          service: queue
        annotations:
          summary: "Video processing queue backlog is high"
          description: "The video-processing queue has more than 20 queued jobs."

      - alert: RetryExhaustionsDetected
        expr: increase(video_retry_exhausted_total[5m]) > 0
        labels:
          severity: warning
          service: workers
        annotations:
          summary: "Retry-exhausted video jobs detected"
          description: "At least one video processing job exhausted all retry attempts in the last 5 minutes."

      - alert: FailedJobsPresent
        expr: sum(failed_jobs_current{retry_exhausted="true"}) > 0
        for: 1m
        labels:
          severity: warning
          service: jobs
        annotations:
          summary: "Retry-exhausted failed jobs exist"
          description: "There are retry-exhausted failed video jobs requiring operator attention."

      - alert: ApiHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API p95 latency is high"
          description: "The API p95 request latency is above 1 second for 2 minutes."

      - alert: UploadRejectionsDetected
        expr: increase(video_upload_rejections_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Upload admission control rejected uploads"
          description: "The API rejected uploads due to queue backpressure, unavailable queue, or insufficient workers."

      - alert: UploadRateLimitRejectionsDetected
        expr: increase(video_upload_rate_limit_rejections_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Upload rate limit rejections detected"
          description: "One or more upload requests were rejected by the upload rate limiter in the last 5 minutes."

      - alert: UploadValidationRejectionsDetected
        expr: increase(video_upload_validation_rejections_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Upload validation rejections detected"
          description: "One or more upload requests were rejected by upload validation."

      - alert: UploadIdempotencyErrorsDetected
        expr: increase(video_upload_idempotency_requests_total{outcome="error"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Upload idempotency errors detected"
          description: "One or more upload idempotency checks failed unexpectedly."

      - alert: StuckJobsDetected
        expr: sum(stuck_jobs_current) > 0
        for: 1m
        labels:
          severity: warning
          service: jobs
        annotations:
          summary: "Stuck video jobs detected"
          description: "One or more video jobs appear stuck in QUEUED or PROCESSING state."

      - alert: StuckJobRecoveryFailuresDetected
        expr: increase(stuck_jobs_recovered_total{outcome="enqueue_failed"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: jobs
        annotations:
          summary: "Stuck job recovery failures detected"
          description: "One or more stuck jobs failed to re-enqueue during recovery."

      - alert: ReconcilerDown
        expr: up{job="reconciler"} == 0
        for: 1m
        labels:
          severity: warning
          service: reconciler
        annotations:
          summary: "Reconciler target is down"
          description: "Prometheus cannot scrape the stuck job reconciler metrics endpoint."

      - alert: ReconcilerNotRunning
        expr: time() - reconciler_last_run_timestamp_seconds{job="reconciler"} > 180
        for: 1m
        labels:
          severity: warning
          service: reconciler
        annotations:
          summary: "Reconciler has not run recently"
          description: "The stuck job reconciler has not completed a run in over 3 minutes."

      - alert: ReconcilerLockAcquireErrors
        expr: increase(reconciler_lock_acquire_total{outcome="error"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: reconciler
        annotations:
          summary: "Reconciler lock acquisition errors detected"
          description: "The stuck job reconciler encountered errors while trying to acquire its Redis lock."

      - alert: ReconcilerLockReleaseFailures
        expr: increase(reconciler_lock_release_total{outcome="failed"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: reconciler
        annotations:
          summary: "Reconciler lock release failures detected"
          description: "The stuck job reconciler failed to safely release its Redis lock."
