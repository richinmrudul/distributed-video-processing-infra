global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Docker Compose DNS for scaled `worker` service returns multiple A records.
  - job_name: workers
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - worker
        type: A
        port: 9100

  - job_name: reconciler
    metrics_path: /metrics
    static_configs:
      - targets: ["reconciler:9200"]
