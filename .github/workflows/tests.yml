name: Fast Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=backend:. pytest backend/tests/unit -q

      - name: Run API tests
        run: PYTHONPATH=backend:. pytest backend/tests/api -q

      - name: Run all fast tests
        run: PYTHONPATH=backend:. pytest backend/tests -q -m "not integration"

      - name: Compile check
        run: PYTHONPATH=backend:. python -m compileall -q backend/app workers
