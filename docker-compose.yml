services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://video:video@db:5432/video
      STORAGE_ROOT: /data/storage
      LOG_LEVEL: INFO
    volumes:
      - ./storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
