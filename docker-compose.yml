services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://video:video@db:5432/video
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: video-processing
      STORAGE_ROOT: /data/storage
      LOG_LEVEL: INFO
    volumes:
      - ./storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: rq worker video-processing --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg2://video:video@db:5432/video
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: video-processing
      STORAGE_ROOT: /data/storage
      LOG_LEVEL: INFO
    volumes:
      - ./storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
